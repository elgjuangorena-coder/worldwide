<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1026">
  <title>Worldwide · Mis landmarks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2338e1ff'/%3E%3Cpath d='M2 16h28M16 2c5 4 5 24 0 28M16 2c-5 4-5 24 0 28' fill='none' stroke='%230b1026' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="map" aria-label="Mapa del mundo"></div>

  <div class="side">
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true"></span>
        <span class="brand-name">Worldwide</span>
      </div>
      <div class="search">
        <input id="search-input" type="search" placeholder="Busca un país, estado, municipio o landmark" autocomplete="off" spellcheck="false" aria-label="Buscar">
        <ul id="search-results" class="search-results" role="listbox" hidden></ul>
      </div>
      <nav id="breadcrumb" class="breadcrumb" aria-label="Ubicación actual"></nav>
    </header>

    <aside id="sheet" class="sheet" data-snap="half">
      <div class="sheet-grip" id="sheet-grip" aria-hidden="true"><span></span></div>
      <div class="sheet-header">
        <button id="back-btn" class="icon-btn" type="button" aria-label="Regresar" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="sheet-titles">
          <p id="sheet-kicker" class="sheet-kicker"></p>
          <h1 id="sheet-title" class="sheet-title">Mundo</h1>
          <p id="sheet-subtitle" class="sheet-subtitle" hidden></p>
        </div>
      </div>
      <div id="sheet-stats" class="sheet-stats"></div>
      <div id="sheet-body" class="sheet-body"></div>
    </aside>
  </div>

  <div class="map-controls">
    <button id="home-btn" class="ctrl-btn" type="button" aria-label="Ver el mundo" title="Ver el mundo">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button id="style-btn" class="ctrl-btn" type="button" aria-label="Cambiar estilo del mapa" title="Mapa claro / oscuro">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div id="loading" class="loading" hidden>
    <p id="loading-text">Cargando…</p>
    <div class="loading-bar"><span id="loading-progress"></span></div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@turf/turf@7.4.0/turf.min.js" integrity="sha384-G+b+P1TXEQX2nQW+hvnd1dWiV2mysujghcENksJYyeXd0Z1Bp23Ac/6IRftCtdmI" crossorigin="anonymous"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
